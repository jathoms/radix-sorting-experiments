[package]
name = "sorting-benchmarks"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sorting-benchmarks"
path = "src/main.rs"
bench = false

[dependencies]
rand = "0.10.2"
rayon = "1.12.0"
rdxsort = "0.3.0"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
